# LAFVIN UPS Module 3S monitor configuration
#
# IMPORTANT:
# Automatic shutdown is disabled for the first installation. Observe the
# measured voltage and test the thresholds before changing shutdown_enabled
# to true.

[hardware]
i2c_bus = 1
i2c_address = 0x41
# Retry period when /dev/i2c-* or the INA219 is unavailable.
sensor_retry_seconds = 15

[monitor]
# Measurement and median filtering.
sample_interval_seconds = 2
filter_window = 5

# Do not accumulate low-voltage time immediately after boot.
startup_grace_seconds = 30

# Reject clearly impossible readings instead of treating them as low voltage.
min_valid_voltage = 6.0
max_valid_voltage = 15.5

# Initial conservative values for a 3-series Li-ion pack.
# These MUST be verified using the actual batteries, load, and a multimeter.
warning_voltage = 10.8
warning_duration_seconds = 60
recovery_voltage = 11.0

shutdown_voltage = 10.4
shutdown_duration_seconds = 60

emergency_voltage = 9.9
emergency_duration_seconds = 10

# Used only for the approximate percentage shown in logs/status.
# Shutdown logic always uses voltage, never this percentage.
battery_empty_voltage = 9.0
battery_full_voltage = 12.6

# Periodic journal entry interval. State changes are logged immediately.
log_every_seconds = 30

[actions]
# Keep false until dry-run testing and voltage calibration are complete.
shutdown_enabled = true
shutdown_command = /usr/bin/systemctl poweroff
# If systemd accepts the command but the machine remains alive, retry later.
shutdown_retry_seconds = 60

# Send warning messages to logged-in terminal sessions.
wall_enabled = true
warning_repeat_seconds = 300

# Machine-readable live status. This is recreated after every boot.
status_file = /run/lafvin-ups/status.json

[logging]
level = INFO
